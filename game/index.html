<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>카페 부여</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <div id="stage">

    <!-- 시작 화면 -->
    <section id="title" class="screen active">
      <div class="title-bg"></div>
      <div class="title-card">
        <div class="title-cup">
          <canvas id="titleCup" width="220" height="220"></canvas>
        </div>
        <p class="title-kicker">알바생을 가르치는 작은 카페</p>
        <h1>카페 부여</h1>
        <p class="title-sub">점장이 되어 음료 만드는 법과 라떼 아트를 가르쳐 보세요.</p>
        <button class="btn big" id="btnStart">시작하기</button>
      </div>
    </section>

    <!-- 알바생 선택 -->
    <section id="select" class="screen">
      <div class="select-head">
        <h2>함께 일할 알바생을 골라 주세요</h2>
        <p>나머지 친구들은 손님으로 찾아와요.</p>
      </div>
      <div class="cards" id="cards"></div>
      <div class="select-foot">
        <button class="btn big" id="btnPick" disabled>이 친구와 함께하기</button>
      </div>
    </section>

    <!-- 카페(카운터 + 제조대) -->
    <section id="cafe" class="screen">
      <div id="world">
        <div class="pane" id="counter">
          <img class="bg" src="assets/bg/counter.jpg" alt="">
          <img class="customer" id="customer" alt="">
          <img class="counter-front" src="assets/props/counter_front.png" alt="">
          <div class="served" id="served"><canvas width="400" height="360"></canvas></div>
          <div class="order-memo" id="orderMemo"></div>
        </div>
        <div class="pane" id="bar">
          <img class="bg" src="assets/bg/workbench.jpg" alt="">
          <div class="recipe-card" id="recipeCard"></div>
          <div class="cup" id="cup">
            <img src="assets/props/cup_side.png" alt="">
            <canvas id="liquid" width="400" height="360" aria-label="제조 중인 음료"></canvas>
            <span id="cupCaption" class="cup-caption">빈 컵</span>
          </div>
          <div class="stream" id="stream"></div>
          <div class="ingredients" id="ingredients"></div>
          <div class="helper" id="helper">
            <img id="helperImg" alt="">
            <div class="memo" id="memo"><b>알바 수첩</b><div id="memoList"></div></div>
          </div>
          <div class="bubble" id="bubble"></div>
          <div class="bar-actions" id="barActions"></div>
        </div>
      </div>

      <!-- 라떼 아트 작업(컵 윗면 확대) -->
      <div id="art" class="overlay">
        <div class="art-left">
          <h3 id="artTitle">라떼 아트</h3>
          <p id="artHint" class="hint"></p>
          <div id="artPanel"></div>
        </div>
        <div class="art-cup">
          <img class="cup-top" src="assets/props/cup_top.png" alt="">
          <canvas id="surface" width="450" height="450"></canvas>
          <canvas id="drawLayer" width="450" height="450"></canvas>
          <div class="attempt" id="attempt"></div>
        </div>
        <div class="art-right" id="artRight"></div>
      </div>

      <!-- 대화창 -->
      <div id="talk">
        <img class="talk-portrait" id="talkPortrait" alt="">
        <div class="talk-box" id="talkBox">
          <div class="talk-name" id="talkName"></div>
          <div class="talk-text" id="talkText"></div>
          <div class="talk-next">▼</div>
        </div>
        <div class="talk-choices" id="talkChoices"></div>
      </div>

      <!-- 결과 -->
      <div id="result" class="overlay"></div>

      <aside id="workerPanel" class="worker-panel" aria-label="알바생 작업 현황" hidden>
        <div class="worker-head"><span class="av"><img id="workerPortrait" alt=""></span><div><small id="workerName"></small><strong id="workerStatus">제작 중</strong></div><span id="workerPercent">0%</span></div>
        <div id="workerOrder" class="worker-order"></div>
        <div class="worker-meter" role="progressbar" aria-label="알바생 제작 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="workerFill"></i></div>
        <div id="workerStep" class="worker-step"></div>
        <p id="workerHint">다른 손님의 음료를 직접 만들 수 있어요.</p>
      </aside>

      <div class="topbar">
        <div class="clock"><i class="sun" id="sun"></i><div><b id="clockText">오전 9:00</b><small id="clockHint">30분 단위</small></div><div class="daybar"><i id="dayFill"></i></div></div>
        <div class="money"><span>오늘 번 돈</span><b id="moneyText">0원</b></div>
      </div>
      <div id="toast"></div>
      <div class="hud">
        <button class="chip" id="btnPause">잠깐 쉬기</button>
        <button class="chip" id="btnNote">알바 수첩</button>
        <button class="chip" id="btnMute">소리 켜짐</button>
      </div>
      <div id="notePanel" class="note-panel"></div>
      <div id="pausePanel" class="pause-panel" hidden><div><h2>잠깐 쉬어 가요</h2><p>영업 시간과 알바생 작업이 멈춰 있어요.</p><button class="btn green" id="btnResume">계속하기</button></div></div>
    </section>

    <div id="fade"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/learn.js"></script>
<script src="js/audio.js"></script>
<script src="js/cafe-core.js"></script>
<script src="js/game.js"></script>
</body>
</html>
